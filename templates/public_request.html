<div class="lead-capture-wrapper" style="max-width: 600px; margin: 0 auto; padding: 20px; font-family: sans-serif;">
    <h2>Request a Workspace</h2>
    <p>Fill out the details below and our team will get back to you shortly.</p>

    <form method="POST" action="{% url 'public_request' agency_id=agency.id %}" class="lead-form">
        {% csrf_token %}
        
        {{ form.non_field_errors }}

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">What do you need?</label>
            {{ form.request_for }}
        </div>

        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">First Name</label>
                {{ form.first_name }}
            </div>
            <div style="flex: 1;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Email</label>
                {{ form.email }}
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Phone</label>
            {{ form.phone }}
        </div>

        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Country</label>
                {{ form.country }}
            </div>
        </div>

        <button type="submit" style="background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
            Submit Request
        </button>
    </form>
</div>
